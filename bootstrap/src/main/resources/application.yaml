spring:
  application:
    name: LDES-admin
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway (adapter/src/main/resources/db/migration)
      ddl-auto: validate
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  docker:
    compose:
      # compose.yaml in the project root provides Postgres during development
      lifecycle-management: start-only
  web:
    resources:
      # The frontend is served by FrontendConfig, which also routes the paths of the frontend
      add-mappings: false

server:
  compression:
    # The JavaScript of the frontend shrinks to a quarter
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

ldes-admin:
  security:
    # Set to true to require a JWT (OAuth2 resource server), and configure
    # spring.security.oauth2.resourceserver.jwt.issuer-uri
    enabled: false
  ldio:
    # How long to wait for an LDIO to stop a pipeline when deleting or updating it
    delete-timeout: 30s
  local-runtime:
    ldes-server-image: openldes/ldes-server:4.2.1
    ldio-image: openldes/ldi-orchestrator:3.1.1
    postgres-image: postgres:16-alpine
    startup-timeout: 5m
    # Local LDES servers fragment new members more often than the server default (every 30s)
    fragmentation-cron: "*/5 * * * * *"
  monitor:
    # Samples the throughput of the LDES servers and notices instances going down or coming back
    enabled: true
    interval: 1m
