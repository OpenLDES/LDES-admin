<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.url == "/" %}
<title>{{ site.title }} – {{ site.description | strip | truncatewords: 8 }}</title>
{%- else %}
<title>{{ page.title }} · {{ site.title }}</title>
{%- endif %}
<meta name="description" content="{{ page.description | default: site.description | strip }}">
<meta name="color-scheme" content="dark light">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/screenshots/dashboard.png' | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
  // Before the first paint, so a white theme does not flash black
  try {
    document.documentElement.dataset.theme = localStorage.getItem('ldes-admin-docs.theme') || 'dark'
  } catch (e) {
    // Without storage the theme stays black
  }
</script>
