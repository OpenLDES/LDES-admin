name: 5. Build & Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      # The site holds a demo: a build of the frontend
      - frontend/**
      - .github/workflows/5.deploy-documentation.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/5.deploy-documentation.yml
  workflow_dispatch:

env:
  RUBY_VERSION: ${{ vars.RUBY_VERSION || '4.0' }}

# One deployment at a time: a newer run waits instead of cancelling a deployment in progress
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: docs
      # The base URL of the site, e.g. /LDES-admin; pull requests only check that the site builds
      - name: Set up Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # The demo, on <base URL>/demo/: the frontend restricted to demo mode, on sample data.
      # The version of packageManager in package.json; it runs the scripts with the Node.js of .npmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Install the frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        env:
          # Building needs no Cypress
          CYPRESS_INSTALL_BINARY: 0
      # Vite prefixes the assets, and the router the routes, with the base
      - name: Build the demo
        working-directory: frontend
        run: pnpm build-restrict-to-demo-mode --base "${{ steps.pages.outputs.base_path }}/demo/"
      # After Jekyll, which empties _site when it builds
      - name: Add the demo to the site
        run: mkdir -p _site/demo && cp -R ../frontend/dist/. _site/demo/
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
